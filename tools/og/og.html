<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;600;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;width:1200px;height:630px;background:radial-gradient(70% 60% at 85% 0%,rgba(194,88,31,.16),transparent 70%),#171513;color:#F2ECE3;font-family:'Schibsted Grotesk',sans-serif;display:flex;align-items:center;gap:60px;padding:0 70px}
.ring{flex:none;width:370px;height:370px;border-radius:50%;padding:7px;background:conic-gradient(from 210deg,#F0A35C,#C2581F,#A9481A,#F0A35C)}
.ring img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:5px solid #171513;display:block}
.logo{height:76px;display:block}
.line{font-size:34px;font-weight:600;line-height:1.2;margin-top:34px;letter-spacing:-.01em}
.sub{font-size:22px;white-space:nowrap;color:#A79E94;margin-top:14px}
.loc{font-family:'JetBrains Mono',monospace;font-size:20px;letter-spacing:.12em;color:#F0A35C;margin-top:26px}
.ph{font-size:36px;font-weight:800;letter-spacing:-.02em;margin-top:10px}
</style></head><body>
<div class="ring"><img src="imperial-decking.webp"></div>
<div><img class="logo" src="logo-imperial-decking.webp">
<div class="line">George · Redwood fences, gates, decks &amp; pergolas</div>
<div class="sub">Building since 1991 · 35 years of hands-on experience</div>
<div class="loc">SONORA, CALIFORNIA</div>
<div class="ph">(415) 996-5183</div></div>
</body></html>
