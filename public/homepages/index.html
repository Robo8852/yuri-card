<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Imperial Decking · Pick a headline</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<style>
:root{--bg:#F5F0E9;--fg:#1D1B19;--muted:#5A534C;--card:#fff;--accent:#C2581F}
@media (prefers-color-scheme:dark){:root{--bg:#171513;--fg:#F2ECE3;--muted:#A79E94;--card:#211E1B}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,sans-serif;padding:clamp(24px,5vw,64px) 16px}
main{max-width:1100px;margin:0 auto}
h1{font-size:clamp(28px,4vw,44px);letter-spacing:-.03em;line-height:1.05;margin:0}
p{color:var(--muted);margin:12px 0 0}
ul{list-style:none;padding:0;margin:36px 0 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:14px}
a{display:block;height:100%;background:var(--card);color:inherit;text-decoration:none;border-radius:22px;padding:22px;border:1px solid transparent;transition:border-color .15s,transform .15s}
a:hover,a:focus-visible{border-color:var(--accent);transform:translateY(-2px)}
b{display:block;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
strong{display:block;font-size:22px;letter-spacing:-.02em;margin-top:8px}
span{display:block;color:var(--muted);font-size:15px;margin-top:6px}
</style>
</head>
<body>
<main>
<h1>Pick a headline</h1>
<p>Same Forged Iron page, two headlines. Everything else is identical.</p>
<ul>
<li><a href="pick-one.html"><b>Pick one</b><strong>A redwood gate, fence or deck that still looks right in twenty years.</strong></a></li>
<li><a href="pick-two.html"><b>Pick two</b><strong>Redwood that still looks right in twenty years.</strong></a></li>
</ul>
</main>
</body>
</html>
